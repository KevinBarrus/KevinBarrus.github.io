<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf5ed" />
    <title>疯狂巴鲁斯 — 开发 / 研究 / 内容创作</title>
    <meta name="description" content="疯狂巴鲁斯的个人网站，记录技术、研究、项目与思考" />
    <link rel="stylesheet" href="./styles.css?v=47631c15" />
  </head>
  <body data-page="home">
    <header class="topbar shell" aria-label="主导航" data-i18n-aria-label="mainNavigation">
      <a class="nav-link" href="#about" data-i18n="about">关于</a>
      <a class="nav-link language-link" href="./en/">English</a>
      <nav class="socials" aria-label="社交链接" data-i18n-aria-label="socialLinks"></nav>
    </header>

    <main>
      <section class="hero shell" id="about" aria-labelledby="name">
        <div class="hero-copy">
          <!-- <p class="eyebrow">PERSONAL ARCHIVE · 2026</p>  -->
          <h1 id="name">疯狂巴鲁斯</h1>
          <p class="role" data-i18n-html="role">开发者 <span>/</span> 研究者 <span>/</span> 内容创作者</p>
          <div class="hero-rule"></div>
          <div class="project-slot" aria-label="精选项目预留区域" data-i18n-aria-label="projectSlot">
            <span data-i18n="personalProjects">个人项目</span>
            <span class="slot-note">Coming soon</span>
          </div>
        </div>

        <div class="hero-art" aria-label="个人头像" data-i18n-aria-label="profileImage">
          <div class="art-glow"></div>
          <img src="./pic/avatar.png" alt="轻音少女合照" data-i18n-alt="avatarAlt" />
        </div>
      </section>

      <section class="archive-section shell" aria-labelledby="archive-title">
        <div class="archive-heading">
          <div class="section-heading">
            <h2 id="archive-title" data-i18n="articles">文章</h2>
          </div>
          <label class="search-box">
            <span class="sr-only" data-i18n="searchArticles">搜索文章</span>
            <input id="article-search" type="search" placeholder="搜索文章" data-i18n-placeholder="searchArticles" />
            <span aria-hidden="true">⌕</span>
          </label>
        </div>
        <div class="tag-filter" id="tag-filter" aria-label="按标签筛选文章" data-i18n-aria-label="filterByTag"></div>
        <nav class="year-nav" id="year-nav" aria-label="按年份浏览文章" data-i18n-aria-label="yearNavigation" hidden></nav>
        <div class="article-list" id="article-list" aria-live="polite"></div>
      </section>

    </main>

    <script src="./social-links.js?v=3b5ca7cc"></script>
    <script src="./i18n.js?v=db4b48b7"></script>
    <script src="./tag-config.js?v=2ed0e32a"></script>
    <script src="./script.js?v=41b0e037"></script>
  </body>
</html>
